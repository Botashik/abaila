<style>
/* Layout: one phone-width app column, centred; same look as the Abaila prototype (teal = safe, red = scam). */
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#E9E3D6; --line:#E2DCCF; --ink:#1B2A2F; --muted:#4A585C;
  --primary:#0F5E57; --primary-text:#0F5E57; --primary-ink:#FFFFFF; --primary-soft:#D7EDE9; --primary-soft-ink:#0A443F;
  --danger:#B42318; --danger-ink:#FFFFFF; --danger-text:#912018; --warn-bg:#FFF4E5; --warn-text:#7A2E0E; --warn-chip:#F6C77A;
  --call-bg:#1B2A2F; --call-ink:#FFFFFF; --call-muted:#C9D3D5; --call-line:#5E6E72;
  --font:'Noto Sans', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111A1C; --surface:#1A2528; --surface2:#24312F; --line:#2E3B3E; --ink:#E7EEEC; --muted:#A8B6B8;
  --primary:#1F7A6F; --primary-text:#6CCFC0; --primary-ink:#FFFFFF; --primary-soft:#173C37; --primary-soft-ink:#BFE6DF;
  --danger:#C42B20; --danger-ink:#FFFFFF; --danger-text:#FF8F86; --warn-bg:#33261A; --warn-text:#F6C99A; --warn-chip:#8A6420;
  --call-bg:#0B1214; --call-ink:#FFFFFF; --call-muted:#AEBBBD; --call-line:#4A595C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111A1C; --surface:#1A2528; --surface2:#24312F; --line:#2E3B3E; --ink:#E7EEEC; --muted:#A8B6B8;
  --primary:#1F7A6F; --primary-text:#6CCFC0; --primary-ink:#FFFFFF; --primary-soft:#173C37; --primary-soft-ink:#BFE6DF;
  --danger:#C42B20; --danger-ink:#FFFFFF; --danger-text:#FF8F86; --warn-bg:#33261A; --warn-text:#F6C99A; --warn-chip:#8A6420;
  --call-bg:#0B1214; --call-ink:#FFFFFF; --call-muted:#AEBBBD; --call-line:#4A595C; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary-text);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:12px 24px}
.demobar{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);padding-block:4px 10px;flex-wrap:wrap}
.badge{background:var(--surface2);color:var(--ink);border-radius:999px;padding:4px 10px;font-weight:600;font-size:13px}
.view{display:flex;flex-direction:column;gap:16px;flex:1}
h1{margin:0;font-size:28px;line-height:1.2;font-weight:800;text-wrap:balance}
h2{margin:0;font-size:19px;font-weight:700}
p{margin:0}
.lead{color:var(--muted)}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--surface);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.list{background:var(--surface);border-radius:18px;display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.row .t b{font-weight:600;overflow-wrap:anywhere}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:16px;border:2px solid transparent;
  font-size:18px;font-weight:700;cursor:pointer;text-align:center;padding:0 16px;width:100%}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.danger{background:var(--danger);color:var(--danger-ink);min-height:64px;font-size:21px;font-weight:800}
.btn.ghost{background:transparent;border-color:var(--primary-text);color:var(--primary-text)}
.btn.quiet{background:transparent;color:var(--muted);min-height:48px;font-weight:600;font-size:17px}
.btn.dashed{background:transparent;border:2px dashed var(--primary-text);color:var(--primary-text)}
.btn.small{min-height:46px;font-size:16px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:default}
.choice{display:flex;align-items:center;gap:14px;min-height:68px;padding:0 18px;border-radius:16px;background:var(--surface);
  border:2px solid var(--line);font-size:18px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.choice:hover{border-color:var(--primary-text)}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lang{min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.lang[aria-pressed="true"]{background:var(--primary);border-color:var(--primary-text);color:var(--primary-ink);font-weight:700}
.logo{width:96px;height:96px;border-radius:28px;background:var(--primary);display:flex;align-items:center;justify-content:center;align-self:center}
.hero{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding-top:8px}
.hero h1{font-size:38px}
.checks{display:flex;flex-direction:column}
.checks div{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.checks div:last-child{border-bottom:0}
.checks svg{flex-shrink:0;margin-top:2px}
label.f{font-weight:700;font-size:17px}
input.f,textarea.f{min-height:54px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:10px 14px;width:100%;font-size:18px}
textarea.f{resize:vertical;min-height:96px}
.field{display:flex;flex-direction:column;gap:8px}
.radio{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer}
.radio input{width:24px;height:24px;accent-color:var(--primary-text)}
.status{border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:8px}
.status.on{background:var(--primary);color:var(--primary-ink)}
.status.off{background:var(--warn-bg);color:var(--ink);border:2px solid var(--warn-chip)}
.status .head{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:800}
.status .btn{min-height:48px;font-size:17px}
.pill{font-size:14px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.pill.scam{background:var(--danger);color:var(--danger-ink)}
.pill.mid{background:var(--warn-chip);color:var(--ink)}
.pill.safe{background:var(--primary-soft);color:var(--primary-soft-ink)}
.pill.grey{background:var(--surface2);color:var(--ink)}
.tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:92px;border-radius:14px;background:var(--surface);
  border:0;font-size:14px;font-weight:600;cursor:pointer;padding:8px;text-align:center}
.tool svg{color:var(--primary-text)}
nav.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);
  margin-top:16px;padding:6px 4px calc(10px + env(safe-area-inset-bottom, 0px));border-radius:18px 18px 0 0}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center;border:0;background:none;color:var(--muted);
  font-size:13px;font-weight:600;cursor:pointer}
nav.tabs button[aria-current="page"]{color:var(--primary-text);font-weight:800}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.iconbtn{width:48px;height:48px;border-radius:50%;background:var(--surface);border:0;display:flex;align-items:center;justify-content:center;color:var(--primary-text);cursor:pointer;flex-shrink:0}
.backbtn{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:44px;background:none;border:0;color:var(--primary-text);font-weight:600;cursor:pointer;padding:0}
/* call screen */
.call{background:var(--call-bg);color:var(--call-ink);border-radius:28px;padding:28px 18px 22px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:640px}
.call .who{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.call .num{font-size:28px;font-weight:700;overflow-wrap:anywhere}
.call .sub{color:var(--call-muted);font-size:15px}
.call .btn.ghostc{background:transparent;border-color:var(--call-line);color:var(--call-ink);min-height:52px;font-size:17px;font-weight:600}
.callbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.round{min-height:72px;border-radius:20px;border:0;font-size:19px;font-weight:800;cursor:pointer;color:#FFFFFF}
.round.green{background:#1F7A4A}.round.red{background:#B42318}
.transcript{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto}
.bubble{background:rgba(255,255,255,.08);border-radius:14px;padding:10px 12px;font-size:16px}
.bubble.hit{background:rgba(196,43,32,.35)}
.meter{height:12px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
.meter i{display:block;height:100%;background:#2FA36B;transition:width .5s}
.meter i.hi{background:#E5484D}.meter i.mid{background:#E0A43A}
.warning{background:var(--warn-bg);color:var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--danger)}
.warning .wt{font-size:24px;font-weight:800;color:var(--danger-text);line-height:1.2}
.score{width:74px;height:74px;border-radius:50%;background:var(--danger);color:var(--danger-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.score b{font-size:23px;line-height:1}.score span{font-size:12px;font-weight:700}
.heard{background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:700;overflow-wrap:anywhere}
.voice{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;color:var(--warn-text)}
.typeline{display:flex;gap:8px}
.typeline input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:2px solid var(--call-line);background:transparent;color:var(--call-ink);padding:0 12px}
.typeline button{min-height:48px;border-radius:12px;border:0;background:#FFFFFF;color:#1B2A2F;font-weight:700;padding:0 14px;cursor:pointer}
.offnote{background:var(--warn-bg);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:600;font-size:15px}
.scen{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:0 18px;border-radius:16px;background:var(--surface);border:2px solid var(--line);
  cursor:pointer;font-weight:700;font-size:17px;text-align:left;width:100%}
.alert{border:2px solid var(--danger)}
.alert .tag{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--danger-text);letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary-text);color:var(--primary-ink)}
.bar{height:10px;border-radius:6px;background:var(--surface2)}.bar i{display:block;height:100%;border-radius:6px;background:var(--danger)}
.big2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;background:var(--primary);color:var(--primary-ink);border-radius:22px;padding:20px}
.big2 b{font-size:34px;font-weight:800;display:block;font-variant-numeric:tabular-nums}
.plan{border:2px solid var(--line)}.plan.cur{border:3px solid var(--primary)}
.plan .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800;font-size:19px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;
  padding:0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet .card{max-width:440px;width:100%;gap:14px;padding:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;z-index:30;max-width:min(400px, calc(100% - 32px));text-align:center}
.result{border-radius:16px;padding:14px 16px;font-weight:600}
.result.bad{background:var(--danger);color:var(--danger-ink)}
.result.ok{background:var(--primary-soft);color:var(--primary-soft-ink)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.switch{min-width:76px;min-height:40px;border-radius:999px;border:0;font-weight:700;cursor:pointer;background:var(--surface2);color:var(--ink)}
.switch[aria-checked="true"]{background:var(--primary);color:var(--primary-ink)}
.lim{display:flex;flex-direction:column;gap:0}
.lim div{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lim div:last-child{border-bottom:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.warning{animation:pulse .9s ease-in-out 2}
</style>

</head>

};
const RX = {};
for (const k in CATS) RX[k] = CATS[k].p.map(s => new RegExp(s.split("~").join(LET), "iu"));
const W = {reported:.6, reportedNum:.35};
for (const k in CATS) W[k] = CATS[k].w;
function norm(s){ return String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[’`]/g,"'").replace(/\s+/g," ").trim(); }
function digits(s){ let d = String(s||"").replace(/\D/g,""); if (d.length === 11 && d[0] === "8") d = "7" + d.slice(1); if (d.length === 10) d = "7" + d; return d; }
function analyze(lines, number){
  const found = {}; const hitLines = new Set();
  lines.forEach((line, i) => {
    const n = norm(line);
    for (const k in RX) if (RX[k].some(r => r.test(n))) { found[k] = true; hitLines.add(i); }
    S.phrases.forEach(ph => { if (ph && n.includes(norm(ph))) { found.reported = true; hitLines.add(i); } });
  });
  if (number && reportCount(number) > 0) found.reportedNum = true;
  let keep = 1; Object.keys(found).forEach(k => keep *= (1 - W[k]));
  const risk = Math.round((1 - keep) * 100);
  return { risk, cats:Object.keys(found), hits:[...hitLines] };
}
function reportCount(number){ const d = digits(number); if (d.length < 6) return 0; return S.reports.filter(r => digits(r.number) === d).length; }
function adviceFor(cats){
  if (cats.includes("code")) return "adv_code";
  if (cats.includes("transfer") || cats.includes("relative") || cats.includes("prize")) return "adv_money";
  if (cats.includes("remote")) return "adv_app";
  return "adv_general";
}

/* ---------- the call ---------- */
function startScenario(id){
  const sc = SCEN[id];
  const daughter = id === "daughter";
  C = {id, number: daughter && S.family && S.role==="self" ? S.family.phone : sc.num,
       name: daughter && S.family && S.role==="self" ? S.family.name : "",
       script: (sc.lines[S.lang]||[]).slice(), lines:[], phase:"incoming", warned:false, res:{risk:0,cats:[],hits:[]}, timer:null, started:0};
  U.scenarios = false; V = "call"; render();
}
function answer(){
  C.phase = "active"; C.started = Date.now(); render();
  if (C.script.length) C.timer = setInterval(() => {
    if (!C || C.phase !== "active") return;
    const next = C.script.shift(); if (next) addLine(next);
    if (!C.script.length) { clearInterval(C.timer); C.timer = null; }
  }, 2200);
}
function addLine(text){
  if (!C) return;
  C.lines.push(text);
  if (S.access === "granted") {
    C.res = analyze(C.lines, C.number);
    if (C.res.risk > 50 && !C.warned) { C.warned = true; warnOut(); }
  }
  render();
  const tr = document.getElementById("transcript"); if (tr) tr.scrollTop = tr.scrollHeight;
}
function warnOut(){
  try { if (navigator.vibrate) navigator.vibrate([300,150,300]); } catch(e) {}
  if (!S.voice) return;
  try {
    const synth = window.speechSynthesis; if (!synth) return;
    const lang = {kk:"kk-KZ", ru:"ru-RU", en:"en-US"}[S.lang];
    const voices = synth.getVoices ? synth.getVoices() : [];
    let say = t("warnTitle") + " " + t(adviceFor(C.res.cats)); let useLang = lang;
    if (S.lang === "kk" && voices.length && !voices.some(v => (v.lang||"").toLowerCase().startsWith("kk"))) { say = D.ru.warnTitle + " " + D.ru[adviceFor(C.res.cats)]; useLang = "ru-RU"; }
    const u = new SpeechSynthesisUtterance(say); u.lang = useLang; u.rate = 0.95; synth.cancel(); synth.speak(u);
  } catch(e) {}
}
function endCall(kind){   // kind: hung | known | ended | declined
  if (!C) return;
  if (C.timer) { clearInterval(C.timer); C.timer = null; }
  try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e) {}
  const on = S.access === "granted";
  const res = on ? analyze(C.lines, C.number) : {risk:0,cats:[],hits:[]};
  const call = {id: "c"+Date.now(), number:C.number, name:C.name, time:Date.now(), risk: kind==="known"?0:res.risk, cats:res.cats,
    words: res.hits.map(i => C.lines[i]), outcome: kind==="known"?"known":(kind==="hung"?"hung":"ended"), checked: on, saved:false};
  const msgs = [];
  if (kind === "declined") { C = null; V = "home"; render(); return; }
  if (on && call.risk > 50) {
    call.saved = true; msgs.push(t("toastSaved"));
    const level = S.family ? S.family.level : "serious";
    const serious = call.risk >= 60;
    if (S.family && planActive() && (level === "all" || serious)) {
      S.alerts.unshift({id:"a"+Date.now(), type:"scam", number:call.number, risk:call.risk, cats:call.cats, hung: kind==="hung", time:Date.now(), level, done:false});
      msgs.push(t("toastAlert",{name:famName()}));
    }
  } else if (kind === "known") msgs.push(t("toastSafe")); else msgs.push(t("toastEnded"));
  S.calls.unshift(call); S.calls = S.calls.slice(0, 50); save();
  const wasOff = !on && C.lines.length > 0;
  C = null;
  if (wasOff) { V = "checktext"; U.textResult = null; render(); toast(t("afterOff")); return; }
  V = "home"; render(); toast(msgs.join(" · "));
}
function renderCall(){
  if (!C) return "";
  const on = S.access === "granted";
  const rep = reportCount(C.number);
  const head = `<div class="who"><span class="sub">${C.phase==="incoming"?t("incoming"):t("inCall")}</span><span class="num">${esc(C.name||C.number)}</span>
     ${C.name?`<span class="sub">${esc(C.number)}</span>`:""}${rep && on ? `<span class="pill scam">${t("reportedN",{n:rep})}</span>`:""}</div>`;
  if (C.phase === "incoming") return `<div class="call">${head}<div style="flex:1"></div>
     ${on?"":`<p class="offnote">${t("notListening")}</p>`}
     <div class="callbtns"><button class="round red" data-a="decline">${t("decline")}</button><button class="round green" data-a="answer">${t("answer")}</button></div></div>`;
  const r = C.res.risk; const cls = r > 50 ? "hi" : r > 25 ? "mid" : "";
  const warn = on && C.warned;
  const hitSet = new Set(C.res.hits);
  return `<div class="call">${head}
   ${warn ? `<div class="warning" role="alert"><div class="top"><div><div class="wt">${t("warnTitle")}</div><b style="color:var(--muted)">${t("warnSub")}</b></div><div class="score"><b>${r}%</b><span>${t("scamWord")}</span></div></div>
      <b style="font-size:15px;color:var(--muted)">${t("heard")}</b>${C.res.hits.slice(-2).map(i=>`<div class="heard">«${esc(C.lines[i])}»</div>`).join("")}
      <p><b>${t(adviceFor(C.res.cats))}</b></p>${S.voice?`<div class="voice">${I.speaker}${t("voiceOn")}</div>`:""}</div>` : ""}
   ${on ? `<div><div class="top" style="font-size:14px;color:var(--call-muted)"><span>${warn?t("riskLabel"):t("listening")}</span><b style="color:var(--call-ink)">${r}%</b></div><div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${r}" aria-label="${t("riskLabel")}"><i class="${cls}" style="width:${Math.max(3,r)}%"></i></div></div>`
        : `<p class="offnote">${t("notListening")}</p>`}
   <div class="transcript" id="transcript" aria-live="polite">${C.lines.map((l,i)=>`<div class="bubble ${on&&hitSet.has(i)?"hit":""}">${esc(l)}</div>`).join("")}</div>
   <form id="lineForm" class="typeline"><label for="lineIn" class="sub" style="position:absolute;left:-9999px">${t("typeLine")}</label><input id="lineIn" autocomplete="off" placeholder="${esc(t("typeLine"))}"><button type="submit">${t("add")}</button></form>
   <div style="flex:1"></div>
   ${warn ? `<button class="btn danger" data-a="hang">${t("hangUp")}</button><button class="btn ghostc" data-a="known">${t("knowPerson")}</button>
       <p class="sub" style="text-align:center">${S.family ? (planActive()? esc(t("familyWillGet",{name:famName()})) : t("familyNeedsPlan")) : ""}</p>`
     : `<button class="btn danger" data-a="end">${t("endCall")}</button>`}
  </div>`;
}

/* ---------- render ---------- */
const app = document.getElementById("app"), layer = document.getElementById("layer");
function render(){
  const f = VIEWS[V] || VIEWS.home;
  app.innerHTML = `<div class="demobar"><span class="badge">${t("demo")}</span><span>Abaila</span></div>` + f() + renderScenarios();
  document.documentElement.lang = S.lang === "kk" ? "kk" : S.lang;
  layer.innerHTML = renderSheet();
}
function renderScenarios(){
  if (!U.scenarios) return "";
  const ids = ["bank","relative","prize","telecom","daughter","custom"];
  return `<div class="sheet" data-a="closeSheetBg"><div class="card" role="dialog" aria-modal="true" aria-label="${t("scenTitle")}"><h2>${t("scenTitle")}</h2><p class="muted">${t("scenLead")}</p>
   ${ids.map(id=>`<button class="scen" data-a="scen" data-v="${id}">${t("sc_"+id)}<span style="color:var(--primary-text)">${I.chev}</span></button>`).join("")}
   <button class="btn quiet" data-a="closeScen">${t("cancel")}</button></div></div>`;
}
function renderSheet(){
  if (!U.sheet) return "";
  if (U.sheet === "delAll") return `<div class="sheet"><div class="card" role="dialog" aria-modal="true"><b>${t("confirmDel")}</b><button class="btn danger" style="min-height:56px;font-size:18px" data-a="delAll">${t("yesDel")}</button><button class="btn quiet" data-a="closeSheet">${t("cancel")}</button></div></div>`;
  if (U.sheet === "reset") return `<div class="sheet"><div class="card" role="dialog" aria-modal="true"><b>${t("resetQ")}</b><button class="btn danger" style="min-height:56px;font-size:18px" data-a="reset">${t("yesReset")}</button><button class="btn quiet" data-a="closeSheet">${t("cancel")}</button></div></div>`;
  if (U.sheet === "askFamily") return `<div class="sheet"><div class="card" role="dialog" aria-modal="true"><h2>${t("askFamily")}</h2>
     ${S.family ? `<p>${esc(t("askFamText",{name:famName()}))}</p><button class="btn primary" data-a="sendHelp">${t("send")}</button>`
       : `<p>${t("needFamily")}</p><button class="btn primary" data-a="go" data-v="connect">${t("connect")}</button>`}
     <button class="btn quiet" data-a="closeSheet">${t("cancel")}</button></div></div>`;
  return "";
}
let toastTimer = null;
function toast(msg){
  let el = document.getElementById("toast");
  if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3800);
}
function go(v){ V = v; U.sheet = null; if (v !== "checknum") U.numResult = null; if (v !== "checktext") U.textResult = null; render(); window.scrollTo(0,0); }

/* ---------- actions ---------- */
const A = {
 go: v => go(v),
 lang: v => { S.lang = v; save(); render(); },
 role: v => { S.role = v; save(); go(v === "family" ? "connect" : "privacy"); },
 allow: () => { S.access = "granted"; save(); if (S.step === "done") go("home"); else go("connect"); },
 deny: () => { S.access = "denied"; save(); go("limited"); },
 limContinue: () => go("connect"),
 skipConnect: () => { finishSetup(); },
 scenarios: () => { U.scenarios = true; render(); },
 closeScen: () => { U.scenarios = false; render(); },
 closeSheetBg: (v, el, e) => { if (e.target === el) { U.scenarios = false; render(); } },
 scen: v => startScenario(v),
 answer: () => answer(),
 decline: () => endCall("declined"),
 hang: () => endCall("hung"),
 known: () => endCall("known"),
 end: () => endCall("ended"),
 toggleWords: v => { U.open[v] = !U.open[v]; render(); },
 delCall: v => { S.calls = S.calls.filter(c => c.id !== v); save(); render(); toast(t("deleted")); },
 sheet: v => { U.sheet = v; render(); },
 closeSheet: () => { U.sheet = null; render(); },
 delAll: () => { S.calls = S.calls.filter(c => !c.saved); U.sheet = null; save(); render(); toast(t("deleted")); },
 reset: () => { try { localStorage.removeItem(KEY); } catch(e) {} const lang = S.lang; S = fresh(); S.lang = lang; U = {open:{}, repWho:"bank", sheet:null, scenarios:false}; save(); go("welcome"); },
 repWho: (v, el) => { U.repWho = v; document.querySelectorAll('[data-a="repWho"]').forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v))); },
 reportFrom: v => { U.repPrefill = v; go("report"); },
 alertDone: v => { const a = S.alerts.find(x => x.id === v); if (a) a.done = true; save(); render(); },
 askFamily: () => { U.sheet = "askFamily"; render(); },
 sendHelp: () => { S.alerts.unshift({id:"a"+Date.now(), type:"help", time:Date.now(), done:false}); U.sheet = null; save(); render(); toast(t("sentTo",{name:famName()})); },
 textEx: v => { const ta = document.getElementById("tText"); if (ta) { ta.value = TEXT_EX[S.lang][+v]; ta.focus(); } },
 toggleAccess: () => { if (S.access === "granted") { S.access = "denied"; save(); render(); } else { go("privacy"); } },
 toggleVoice: () => { S.voice = !S.voice; save(); render(); },
 trial: () => { S.plan = "trial"; S.trialEnd = Date.now() + 7*864e5; save(); render(); },
 buy: () => { S.plan = "family"; save(); render(); },
 endTrial: () => { S.plan = "free"; S.trialEnd = 0; save(); render(); }
};
function finishSetup(){ S.step = "done"; if (S.family && S.plan === "free") { S.plan = "trial"; S.trialEnd = Date.now() + 7*864e5; } save(); go("home"); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.dataset.a === "closeSheetBg") { fn(el.dataset.v, el, e); return; }
  e.preventDefault(); fn(el.dataset.v, el, e);
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const id = e.target.id;
  if (id === "connForm") {
    const name = document.getElementById("cName").value.trim(), phone = document.getElementById("cPhone").value.trim();
    const level = (document.querySelector('input[name="lvl"]:checked')||{}).value || "serious";
    if (!name || digits(phone).length < 6) { document.getElementById("connErr").hidden = false; return; }
    S.family = {name, phone, level}; save();
    if (S.step === "done") go("settings"); else finishSetup();
  } else if (id === "numForm") {
    const number = document.getElementById("nNum").value.trim(); if (!number) return;
    U.numResult = {number, n: reportCount(number)}; render();
  } else if (id === "textForm") {
    const text = document.getElementById("tText").value.trim(); if (!text) return;
    const lines = text.split(/[\n.!?]+/).map(s => s.trim()).filter(Boolean);
    const r = analyze(lines.length ? lines : [text], null); U.textResult = {text, risk:r.risk, cats:r.cats}; render();
  } else if (id === "repForm") {
    const number = document.getElementById("rNum").value.trim(), words = document.getElementById("rWords").value.trim();
    if (digits(number).length < 6) { document.getElementById("repErr").hidden = false; return; }
    S.reports.unshift({number, who:U.repWho, words, time:Date.now()});
    if (words) words.split(/[\n.!?]+/).map(s => s.trim()).filter(s => s.length >= 6 && s.length <= 80).forEach(p => { if (!S.phrases.includes(p)) S.phrases.unshift(p); });
    S.phrases = S.phrases.slice(0, 30); U.repPrefill = ""; save(); render(); toast(t("repThanks"));
  } else if (id === "lineForm") {
    const inp = document.getElementById("lineIn"); const v = inp.value.trim(); if (!v) return;
    addLine(v); const again = document.getElementById("lineIn"); if (again) again.focus();
  }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && (U.sheet || U.scenarios)) { U.sheet = null; U.scenarios = false; render(); } });
try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch(e) {}
render();
window.__abaila = {analyze, SCEN, get S(){return S;}};
if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
})();
</script>
